# Local cluster for testing the manifests. The port maps and the
# ingress-ready label let the nginx ingress controller bind to localhost:8080,
# which is how you reach the API from the host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: askpdf
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
