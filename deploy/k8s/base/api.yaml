apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: askpdf
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: askpdf
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: askpdf
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: askpdf
      # Must exceed SHUTDOWN_DRAIN_MS + SHUTDOWN_TIMEOUT_MS (5s + 15s) plus the
      # preStop sleep, or Kubernetes SIGKILLs mid-drain and in-flight requests die.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: askpdf:latest
          imagePullPolicy: IfNotPresent
          command: ['node', 'src/entrypoints/api.js']
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: askpdf-config
            - secretRef:
                name: askpdf-secrets
          env:
            # Kubernetes removes the pod from Service endpoints and sends SIGTERM
            # concurrently, so without this pause a request can arrive after the
            # server has already stopped accepting.
            - name: SHUTDOWN_DRAIN_MS
              value: '5000'
          lifecycle:
            preStop:
              exec:
                command: ['sleep', '5']
          startupProbe:
            # Generous: the process connects to Mongo, Redis and GCS before it
            # listens. Failing startup is what stops a slow boot being mistaken
            # for a crash loop.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            # Deliberately shallow — never restarts on a dependency blip.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # No CPU limit on purpose: throttling a Node process adds tail
              # latency for no benefit when the request already reserves a share.
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem still needs somewhere writable for scratch.
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: askpdf
              app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: askpdf
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: askpdf
    app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  # Keeps a node drain from taking every replica at once.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: askpdf
      app.kubernetes.io/component: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Slow to shrink: a brief lull should not drop capacity that a spike
      # thirty seconds later would need back.
      stabilizationWindowSeconds: 300
