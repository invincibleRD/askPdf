apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: askpdf
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: askpdf
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: askpdf
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9100'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: askpdf
      # Longer than the API: a worker mid-ingestion needs to finish or unwind at
      # a stage boundary. A PDF part-way through embedding is the case this
      # protects — killing it wastes the Gemini spend already incurred.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: askpdf:latest
          imagePullPolicy: IfNotPresent
          command: ['node', 'src/entrypoints/worker.js']
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: askpdf-config
            - secretRef:
                name: askpdf-secrets
          env:
            - name: SHUTDOWN_TIMEOUT_MS
              value: '90000'
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # No readinessProbe: the worker serves no traffic, so there is nothing
          # to gate. Readiness would only stop Prometheus scraping it.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Embedding batches hold vectors in memory; NODE_OPTIONS caps the
              # heap below this so the process GCs rather than being OOM-killed.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  labels:
    app.kubernetes.io/name: askpdf
    app.kubernetes.io/component: worker
spec:
  # Headless: nothing load-balances to a worker, this only gives Prometheus
  # stable per-pod DNS to scrape.
  clusterIP: None
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
  selector:
    app.kubernetes.io/name: askpdf
    app.kubernetes.io/component: worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  # maxUnavailable rather than minAvailable, so a single-replica deployment can
  # still be drained during a node upgrade.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: askpdf
      app.kubernetes.io/component: worker
