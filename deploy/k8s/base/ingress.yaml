apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: askpdf
  annotations:
    # Uploads are capped at 20MB by the app; the proxy has to allow at least
    # that or it rejects the body before the app ever sees it.
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
    # SSE answers stream for as long as the model takes.
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
