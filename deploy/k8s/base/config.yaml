apiVersion: v1
kind: ConfigMap
metadata:
  name: askpdf-config
data:
  NODE_ENV: production
  PORT: '3000'
  HOST: 0.0.0.0
  SERVICE_NAME: askpdf
  LOG_LEVEL: info
  # JSON to stdout for the cluster's log collector.
  LOG_PRETTY: 'false'

  TRUST_PROXY: 'true'
  REQUEST_TIMEOUT_MS: '30000'
  SHUTDOWN_TIMEOUT_MS: '15000'
  SHUTDOWN_DRAIN_MS: '5000'

  MONGO_MAX_POOL_SIZE: '20'
  MONGO_MIN_POOL_SIZE: '2'
  MONGO_SERVER_SELECTION_TIMEOUT_MS: '10000'

  QUEUE_NAME: ingest
  QUEUE_MAX_ATTEMPTS: '3'
  QUEUE_BACKOFF_BASE_MS: '2000'
  QUEUE_BLOCK_TIMEOUT_SEC: '5'
  QUEUE_VISIBILITY_TIMEOUT_MS: '300000'
  WORKER_CONCURRENCY: '2'
  JOB_STATUS_TTL_SEC: '86400'

  STORAGE_DRIVER: gcs
  GCS_PREFIX: pdf
  GCS_SIGNED_URL_TTL_SEC: '900'

  MAX_UPLOAD_BYTES: '20971520'
  MAX_PDF_PAGES: '500'
  CHUNK_SIZE_TOKENS: '512'
  CHUNK_OVERLAP_TOKENS: '64'

  AI_PROVIDER: gemini
  GEMINI_EMBEDDING_MODEL: gemini-embedding-001
  GEMINI_CHAT_MODEL: gemini-2.5-flash
  EMBEDDING_DIMENSIONS: '768'
  EMBEDDING_BATCH_SIZE: '32'
  AI_REQUEST_TIMEOUT_MS: '60000'
  AI_MAX_RETRIES: '3'

  RETRIEVAL_MIN_SCORE: '0.57'
  RETRIEVAL_TOP_K: '6'
  RETRIEVAL_CANDIDATES: '100'
  VECTOR_INDEX_NAME: chunk_embedding_index
  VECTOR_SEARCH_DRIVER: memory

  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 30d
  JWT_ISSUER: askpdf
  JWT_AUDIENCE: askpdf-api
  BCRYPT_ROUNDS: '12'

  RATE_LIMIT_WINDOW_MS: '60000'
  RATE_LIMIT_MAX: '120'
  RATE_LIMIT_AUTH_MAX: '10'
  RATE_LIMIT_UPLOAD_MAX: '10'
  RATE_LIMIT_CHAT_MAX: '30'

  METRICS_ENABLED: 'true'
  METRICS_PATH: /metrics
  WORKER_METRICS_PORT: '9100'
  SWAGGER_ENABLED: 'true'
