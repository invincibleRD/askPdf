# Not applied by kustomization.yaml — install the External Secrets Operator
# first, then apply this. Kept here so the secret contract is documented in the
# repo without any secret value being in it.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: ultron-477805
      auth:
        workloadIdentity:
          clusterLocation: asia-south1
          clusterName: askpdf-cluster
          serviceAccountRef:
            name: askpdf
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: askpdf-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: askpdf-secrets
  data:
    - secretKey: MONGO_URI
      remoteRef: { key: askpdf-mongo-uri }
    - secretKey: GEMINI_API_KEY
      remoteRef: { key: askpdf-gemini-api-key }
    - secretKey: JWT_ACCESS_SECRET
      remoteRef: { key: askpdf-jwt-access-secret }
    - secretKey: JWT_REFRESH_SECRET
      remoteRef: { key: askpdf-jwt-refresh-secret }
