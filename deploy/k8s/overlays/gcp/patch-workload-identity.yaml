apiVersion: v1
kind: ServiceAccount
metadata:
  name: askpdf
  annotations:
    # Binds this Kubernetes SA to a Google SA. Grant that GSA
    # roles/storage.objectAdmin on the bucket, then:
    #   gcloud iam service-accounts add-iam-policy-binding \
    #     YOUR_GSA@YOUR_PROJECT_ID.iam.gserviceaccount.com \
    #     --role roles/iam.workloadIdentityUser \
    #     --member "serviceAccount:YOUR_PROJECT_ID.svc.id.goog[askpdf/askpdf]"
    iam.gke.io/gcp-service-account: YOUR_GSA@YOUR_PROJECT_ID.iam.gserviceaccount.com
