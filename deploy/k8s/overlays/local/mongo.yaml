apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mongo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          args: ['--bind_ip_all']
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            exec:
              command: ['mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  clusterIP: None
  ports:
    - name: mongo
      port: 27017
  selector:
    app.kubernetes.io/name: mongo
