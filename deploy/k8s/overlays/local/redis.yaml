apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Redis here is not a cache: it holds the ingest queue and the refresh
          # token denylist. appendonly makes both survive a restart, and
          # noeviction stops it silently dropping queued jobs under memory
          # pressure.
          args:
            - redis-server
            - --appendonly
            - 'yes'
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ['redis-cli', 'ping'] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ['redis-cli', 'ping'] }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  clusterIP: None
  ports:
    - name: redis
      port: 6379
  selector:
    app.kubernetes.io/name: redis
