name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same ref makes the previous run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Integration suites talk to real MongoDB and Redis rather than mocks, so
    # index definitions and queue semantics are actually exercised.
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/askpdf-ci
          REDIS_URL: redis://127.0.0.1:6379
          GEMINI_API_KEY: ci-placeholder
          AI_PROVIDER: fake
          JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-000000
          JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-00000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: askpdf:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and probe it
        # Proves the image starts, validates its environment and answers
        # /healthz — the failure mode a unit test cannot catch.
        run: |
          docker run -d --name askpdf-ci -p 3000:3000 \
            -e MONGO_URI=mongodb://127.0.0.1:27017/askpdf \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e GEMINI_API_KEY=ci-placeholder \
            -e CORS_ORIGINS=https://example.com \
            -e JWT_ACCESS_SECRET=ci-access-secret-that-is-long-enough-000000 \
            -e JWT_REFRESH_SECRET=ci-refresh-secret-that-is-long-enough-00000 \
            askpdf:${{ github.sha }}

          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:3000/healthz; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done

          echo "container never became healthy"
          docker logs askpdf-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs askpdf-ci || true
